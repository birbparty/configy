name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'

      - name: Install dependencies
        run: nimble install -d -y

      - name: Run tests
        run: nimble test

  platform-define-check:
    # Verifies that platform-specific when defined(...) branches compile cleanly.
    # Uses --compileOnly: Nim emits C but never invokes the cross C compiler, so
    # no SDK/toolchain is needed here. This catches Nim-level errors, not
    # SDK/toolchain link incompatibilities. NOTE: -d:ds3 now pulls --cpu:arm
    # --os:linux + devkitARM flags from the `@if ds3:` block in nim.cfg, so the
    # ds3 row checks real arm/linux codegen (still compileOnly — no devkitARM on
    # CI). A full cross-compile + link is exercised by scripts/build_3ds.sh on a
    # devkitPro machine (see .agents/plans/3ds-support/RESULTS.md). PSP/Vita/WASM
    # still use only the platform define.
    name: Platform-define check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: ds3
            define: ds3
          - target: psp
            define: psp
          - target: vita
            define: vita
          - target: wasm
            define: emscripten
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'

      - name: Install dependencies
        run: nimble install -d -y

      - name: Check platform define branches compile
        run: |
          nim c --compileOnly \
            -d:configyVendor=testvendor \
            -d:${{ matrix.define }} \
            --path:src \
            src/configy.nim
