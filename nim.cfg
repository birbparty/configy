--mm:arc

# psp-gcc 15 promotes -Wincompatible-pointer-types to an error. Nim's NI resolves to
# long int on MIPS32, which conflicts with the int* parameter expected by
# __builtin_sadd_overflow / __builtin_smul_overflow / __builtin_ssub_overflow (used
# by nimAddInt/nimMulInt/nimSubInt in nimbase.h), even though int and long are both
# 32-bit on MIPS32 so no actual truncation occurs.
#
# -Wno-error=incompatible-pointer-types downgrades ALL incompatible-pointer-type errors
# to warnings for this target (GCC provides no per-call-site scoping). Risk is low:
# MIPS32 is uniformly 32-bit, so every such case in generated Nim C is a false positive.
# This preserves integer overflow checking (unlike --overflowChecks:off which disables it
# across the entire Nim runtime).
#
# Note: the CI platform-define-check for PSP uses nim c --compileOnly on a Linux host
# without psp-gcc, so it does not exercise this flag. Validate PSP C-level compilation
# manually using the steps in docs/spikes/supersnappy-console-cross-compile.md.
@if psp:
  --passC:"-Wno-error=incompatible-pointer-types"
@end

# Cross-compile examples:
#   3DS:        nim c -d:ds3 --cpu:arm --os:standalone -d:configyVendor=yourorg src/configy.nim
#   PSP:        nim c -d:psp --cpu:mips --os:standalone -d:configyVendor=yourorg src/configy.nim
#   PS Vita:    nim c -d:vita --cpu:arm --os:standalone -d:configyVendor=yourorg src/configy.nim
#   WASM:       nim c -d:emscripten --os:linux -d:configyVendor=yourorg src/configy.nim
