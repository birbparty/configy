--mm:arc

# psp-gcc 15 promotes -Wincompatible-pointer-types to an error. Nim's NI resolves to
# long int on MIPS32, which conflicts with the int* parameter expected by
# __builtin_sadd_overflow / __builtin_smul_overflow / __builtin_ssub_overflow (used
# by nimAddInt/nimMulInt/nimSubInt in nimbase.h), even though int and long are both
# 32-bit on MIPS32 so no actual truncation occurs.
#
# -Wno-error=incompatible-pointer-types downgrades ALL incompatible-pointer-type errors
# to warnings for this target (GCC provides no per-call-site scoping). Risk is low:
# MIPS32 is uniformly 32-bit, so every such case in generated Nim C is a false positive.
# This preserves integer overflow checking (unlike --overflowChecks:off which disables it
# across the entire Nim runtime).
#
# Note: the CI platform-define-check for PSP uses nim c --compileOnly on a Linux host
# without psp-gcc, so it does not exercise this flag. Validate PSP C-level compilation
# manually using the steps in docs/spikes/supersnappy-console-cross-compile.md.
@if psp:
  --passC:"-Wno-error=incompatible-pointer-types"
@end

# Nintendo 3DS (devkitARM, os:linux + newlib, libctru).
#
# The real 3DS target is --os:linux (devkitARM's newlib supplies libc/file-I/O
# stubs and libctru supplies the sdmc: devoptab), NOT --os:standalone. These
# switches MUST be set or `nim c -d:ds3` silently builds a host binary — the
# arm.linux.gcc.* config only fires once cpu/os select an arm/linux target.
# Verified to compile+link with devkitARM (see scripts/build_3ds.sh).
# Toolchain paths assume the devkitPro default install at /opt/devkitpro.
@if ds3:
  --cc:gcc
  --cpu:arm
  --os:linux
  --threads:off
  --define:useMalloc
  --define:nimAllocPagesViaMalloc
  --define:noSignalHandler
  --opt:size

  arm.linux.gcc.path      = "/opt/devkitpro/devkitARM/bin"
  arm.linux.gcc.exe       = "arm-none-eabi-gcc"
  arm.linux.gcc.linkerexe = "arm-none-eabi-gcc"

  # 3DS arch flags (from devkitPro's build system)
  --passC:"-specs=3dsx.specs"
  --passC:"-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft"
  --passC:"-I/opt/devkitpro/libctru/include"

  # Linker — repeat arch flags so GCC picks the armv6k/fpu multilib + 3dsx_crt0.o
  --passL:"-specs=3dsx.specs -march=armv6k -mfloat-abi=hard"
  --passL:"-L/opt/devkitpro/libctru/lib -lctru"
  --passL:"-lm"
  # Nim injects -ldl AND -lrt for os:linux targets; the 3DS (newlib) has neither.
  # (configy pulls in -lrt via std/os -> times.) Empty libdl.a/librt.a stubs on
  # the link path (-L.) satisfy the flags. scripts/build_3ds.sh creates them in
  # the build CWD.
  --passL:"-L."
@end

# Cross-compile examples:
#   3DS:        nim c -d:ds3 -d:configyVendor=yourorg src/configy.nim
#               (--cpu:arm --os:linux + devkitARM toolchain come from the @if ds3: block above)
#   WASM:       nim c -d:emscripten --os:linux -d:configyVendor=yourorg src/configy.nim
#   PSP:        nim c -d:psp --cpu:mips --os:standalone -d:configyVendor=yourorg src/configy.nim
#   PS Vita:    nim c -d:vita --cpu:arm --os:standalone -d:configyVendor=yourorg src/configy.nim
# NOTE: the PSP/Vita examples still show --os:standalone. The 3DS line was
# corrected to --os:linux after verifying that is the real devkitARM target; the
# proven multiplatform reference (raylib-nim-multiplatform/config.nims) likewise
# uses --os:linux for PSP and Vita, so those two examples are LIKELY wrong too —
# but they are unverified here and left as-is pending separate validation.
