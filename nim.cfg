--mm:arc

# psp-gcc 15 promotes -Wincompatible-pointer-types to an error. Nim's NI resolves to
# long int on MIPS32, which conflicts with the int* parameter expected by
# __builtin_sadd_overflow / __builtin_smul_overflow / __builtin_ssub_overflow (used
# by nimAddInt/nimMulInt/nimSubInt in nimbase.h), even though int and long are both
# 32-bit on MIPS32 so no actual truncation occurs.
#
# -Wno-error=incompatible-pointer-types downgrades ALL incompatible-pointer-type errors
# to warnings for this target (GCC provides no per-call-site scoping). Risk is low:
# MIPS32 is uniformly 32-bit, so every such case in generated Nim C is a false positive.
# This preserves integer overflow checking (unlike --overflowChecks:off which disables it
# across the entire Nim runtime).
#
# Note: the CI platform-define-check for PSP uses nim c --compileOnly on a Linux host
# without psp-gcc, so it does not exercise this flag. Validate PSP C-level compilation
# manually using the steps in docs/spikes/supersnappy-console-cross-compile.md.
@if psp:
  --passC:"-Wno-error=incompatible-pointer-types"
@end

# Nintendo 3DS (devkitARM, os:linux + newlib, libctru).
#
# The real 3DS target is --os:linux (devkitARM's newlib supplies libc/file-I/O
# stubs and libctru supplies the sdmc: devoptab), NOT --os:standalone. These
# switches MUST be set or `nim c -d:ds3` silently builds a host binary — the
# arm.linux.gcc.* config only fires once cpu/os select an arm/linux target.
# Verified to compile+link with devkitARM (see scripts/build_3ds.sh).
# Toolchain paths assume the devkitPro default install at /opt/devkitpro.
@if ds3:
  --cc:gcc
  --cpu:arm
  --os:linux
  --threads:off
  --define:useMalloc
  --define:nimAllocPagesViaMalloc
  --define:noSignalHandler
  --opt:size

  arm.linux.gcc.path      = "/opt/devkitpro/devkitARM/bin"
  arm.linux.gcc.exe       = "arm-none-eabi-gcc"
  arm.linux.gcc.linkerexe = "arm-none-eabi-gcc"

  # 3DS arch flags (from devkitPro's build system)
  --passC:"-specs=3dsx.specs"
  --passC:"-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft"
  --passC:"-I/opt/devkitpro/libctru/include"

  # Linker — repeat arch flags so GCC picks the armv6k/fpu multilib + 3dsx_crt0.o
  --passL:"-specs=3dsx.specs -march=armv6k -mfloat-abi=hard"
  --passL:"-L/opt/devkitpro/libctru/lib -lctru"
  --passL:"-lm"
  # Nim injects -ldl AND -lrt for os:linux targets; the 3DS (newlib) has neither.
  # (configy pulls in -lrt via std/os -> times.) Empty libdl.a/librt.a stubs on
  # the link path (-L.) satisfy the flags. scripts/build_3ds.sh creates them in
  # the build CWD.
  --passL:"-L."
@end

# Sony PS Vita (VitaSDK, os:linux + newlib). Graphics-free: configy needs only
# libc + a few Sce* stubs for file I/O — NOT the raylib/SDL2/vitaGL soup a game
# build links. The target switches MUST be set here or `nim c -d:vita` silently
# builds a host binary (the arm.linux.gcc.* block is inert until an arm/linux
# target is selected). Verified to compile+link and pass vita-elf-create with
# VitaSDK (see scripts/build_vita.sh). Toolchain paths assume the VitaSDK default
# install at /usr/local/vitasdk.
@if vita:
  --cc:gcc
  --cpu:arm
  --os:linux
  --threads:off
  --define:useMalloc
  --define:nimAllocPagesViaMalloc
  --define:noSignalHandler
  --opt:size

  # Do NOT add -march/-mfpu/-mfloat-abi: arm-vita-eabi-gcc already defaults to
  # armv7-a+simd / neon / hard-float. (The @if ds3: block's armv6k/mpcore flags
  # are for a different CPU — do not copy them here.)

  # These three paths are hardcoded to the VitaSDK DEFAULT prefix. nim.cfg cannot
  # read shell env, so setting $VITASDK alone does NOT relocate them. For a
  # non-default install, either edit these lines, or run scripts/build_vita.sh —
  # it derives the paths from $VITASDK and passes them on the `nim c` line
  # (--arm.linux.gcc.path / -I / -L), which override the values here. (The @if ds3:
  # block has the same $DEVKITPRO-vs-hardcoded pattern.)
  arm.linux.gcc.path      = "/usr/local/vitasdk/bin"
  arm.linux.gcc.exe       = "arm-vita-eabi-gcc"
  arm.linux.gcc.linkerexe = "arm-vita-eabi-gcc"

  --passC:"-I/usr/local/vitasdk/arm-vita-eabi/include"

  # -Wl,-q (--emit-relocs) is MANDATORY on Vita: vita-elf-create needs the retained
  # relocations to emit SCE relocations into the .velf. Without it, movw/movt
  # absolute addresses keep their link-time values and data-abort when the module
  # loads at a non-link base on real hardware. (Vita3K loads at the link base and
  # HIDES this bug — a successful vita-elf-create is the real -Wl,-q signal.)
  --passL:"-Wl,-q"
  --passL:"-L/usr/local/vitasdk/arm-vita-eabi/lib"

  # libc <-> Sce stubs are mutually dependent: libc's _open_r/_stat_r reference
  # sceIoOpen/sceIoGetstat (defined in SceLibKernel_stub) and
  # sceIoRead/sceIoWrite/sceIoClose (defined in SceIofilemgr_stub). GNU ld is
  # single-pass left-to-right, so we wrap them in --start-group/--end-group to make
  # resolution order-independent (robust against future stub churn). The stub set
  # is verified SUFFICIENT for the read-path build (2026-06-06): the link produced
  # zero unresolved symbols (sceKernelExitProcess/GetThreadId from SceLibKernel_stub,
  # GetProcessId from SceProcessmgr_stub). Append more stubs if a larger surface
  # needs them.
  --passL:"-Wl,--start-group -lc -lm -lSceIofilemgr_stub -lSceLibKernel_stub -lSceProcessmgr_stub -Wl,--end-group"

  # Nim injects -ldl AND -lrt for os:linux targets. Vita ships a REAL libdl.a so
  # -ldl resolves natively — but it has NO librt, and configy pulls in -lrt via
  # std/os -> times (same as 3DS). An empty librt.a stub on the link path (-L.)
  # satisfies the flag; scripts/build_vita.sh creates it in the build CWD. (No
  # libdl stub needed — the real one is used.)
  # MAINTENANCE NOTE: this links cleanly only because configy references no dl*
  # symbol. The real libdl.a has undefined deps (taiGetModuleInfo, module_get_export,
  # ...); the moment any dlopen/dlsym path is added, ld will drag in taihen et al.
  # and the stub set above will need -ltaihen_stub (and likely more).
  --passL:"-L."
@end

# Sega Dreamcast (KallistiOS + sh-elf-gcc, SH-4, little-endian).
#
# ⚠ WARNING: MUST set toolchain switches or `-d:dreamcast` silently builds a host
# binary — the arm.linux.gcc.* block below is inert until --cpu:arm --os:linux is
# active. Source KOS's environ.sh before running `nim c -d:dreamcast`.
#
# ⚠ SPIKE-PENDING (see topdown/.agents/plans/dreamcast-support/01-toolchain-and-nim-sh4.md):
# --cpu:arm is a 32-bit LE proxy — Nim has no native sh4 CPU target. The spike must
# confirm this profile compiles and links against KOS correctly via sh-elf-gcc before
# this block is load-bearing. If SH-4 codegen misbehaves at --opt:size (same class
# of issue as the 3DS port), fall back to --opt:none.
# KOS lib names below (-lkallisti etc.) require a built KOS tree to verify — the
# toolchain here has dc-chain pass-1 complete but KOS itself has not been compiled.
# Toolchain paths assume the local KOS install:
#   KOS_CC_BASE: /Users/punk1290/dreamcast-toolchain/dc/sh-elf
#   KOS_BASE:    /Users/punk1290/dreamcast-toolchain/dc/kos
# For non-default installs, run scripts/build_dreamcast.sh which sources environ.sh
# and passes the resolved paths on the nim c command line, overriding these values.
# Do NOT assume the devkitARM/VitaSDK librt-stub idiom transfers to KOS — the build
# script (configy-uhl) handles any stub/romdisk needs when they are confirmed needed.
@if dreamcast:
  --cc:gcc
  --cpu:arm
  --os:linux
  --threads:off
  --define:useMalloc
  --define:nimAllocPagesViaMalloc
  --define:noSignalHandler
  --opt:size

  # KOS sh-elf GCC (SH-4 little-endian cross compiler).
  # arm.linux.gcc.* keys match the --cpu:arm --os:linux Nim profile above;
  # sh-elf-gcc is the actual compiler (not arm-*). This pairing is intentional.
  arm.linux.gcc.path      = "/Users/punk1290/dreamcast-toolchain/dc/sh-elf/bin"
  arm.linux.gcc.exe       = "sh-elf-gcc"
  arm.linux.gcc.linkerexe = "sh-elf-gcc"

  # SH-4 arch flags (sourced from KOS environ_dreamcast.sh / $KOS_CFLAGS).
  # -ml: SH little-endian mode; -m4-single-only: DC FPU (no paired-single ops).
  --passC:"-ml -m4-single-only"
  --passC:"-ffunction-sections -fdata-sections"
  --passC:"-matomic-model=soft-imask -ftls-model=local-exec"

  # KOS include tree. dc/ headers (maple.h, vmufs.h, vmu_pkg.h) live under
  # kernel/arch/dreamcast/include/dc/ — kos-cc adds this automatically, but
  # nim c invocations that bypass kos-cc need it stated explicitly.
  --passC:"-I/Users/punk1290/dreamcast-toolchain/dc/kos/include"
  --passC:"-I/Users/punk1290/dreamcast-toolchain/dc/kos/kernel/arch/dreamcast/include"

  # Linker: SH-4 arch flags + KOS load address (P2 cached RAM segment).
  # $KOS_START (KOS startup object) is injected by the build script via kos-cc;
  # it is not added here because nim.cfg cannot reference shell env variables.
  --passL:"-ml -m4-single-only"
  --passL:"-Wl,-Ttext=0x8c010000 -Wl,--gc-sections"

  # KOS runtime. -lkallisti provides KOS + newlib libc; -lgcc for SH-4 runtime helpers.
  # SPIKE VERIFY: confirm names against `kos-cc -v` output on a built KOS tree.
  --passL:"-L/Users/punk1290/dreamcast-toolchain/dc/kos/lib/dreamcast"
  --passL:"-Wl,--start-group -lkallisti -lc -Wl,--end-group -lgcc"
@end

# Cross-compile examples:
#   3DS:        nim c -d:ds3 -d:configyVendor=yourorg src/configy.nim
#               (--cpu:arm --os:linux + devkitARM toolchain come from the @if ds3: block above)
#   WASM:       nim c -d:emscripten --os:linux -d:configyVendor=yourorg src/configy.nim
#   PSP:        nim c -d:psp --cpu:mips --os:standalone -d:configyVendor=yourorg src/configy.nim
#   PS Vita:    nim c -d:vita -d:configyVendor=yourorg src/configy.nim
#               (--cpu:arm --os:linux + VitaSDK toolchain come from the @if vita: block above)
#   Dreamcast:  nim c -d:dreamcast -d:configyVendor=yourorg src/configy.nim
#               (--cpu:arm --os:linux + KOS sh-elf toolchain come from the @if dreamcast: block above)
#               Source /Users/punk1290/dreamcast-toolchain/dc/kos/environ.sh first.
#               ⚠ SPIKE-PENDING — see comments in the @if dreamcast: block before use.
# TODO(psp): the PSP example still shows --os:standalone. The 3DS and Vita lines
# were corrected to --os:linux after verifying that is the real SDK target; the
# proven multiplatform reference (raylib-nim-multiplatform/config.nims) likewise
# uses --os:linux for PSP, so the PSP example is LIKELY wrong too — but it is
# unverified here and left as-is pending separate validation (tracked: configy-dy9).
